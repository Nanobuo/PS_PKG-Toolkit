name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Crea una release con questo tag (es. v1.2.0); vuoto = solo build"
        required: false
        default: ""
      notes_only:
        description: "Solo note: aggiorna la descrizione di una release esistente da CHANGELOG.md, senza ricompilare"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !inputs.notes_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PS-PKG-Toolkit --icon assets/ps-pkg-toolkit.png --exclude-module tkinter pkgfree_gui.py
          pyinstaller --noconfirm --onefile --console --name pspkg --icon assets/ps-pkg-toolkit.png --exclude-module PySide6 --exclude-module qfluentwidgets --exclude-module tkinter pkgfree_cli.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\PS-PKG-Toolkit.exe, dist\pspkg.exe, README.md, LICENSE release\

      - uses: actions/upload-artifact@v7
        with:
          name: PS-PKG-Toolkit-windows
          path: release/

  linux:
    if: ${{ !inputs.notes_only }}
    # The oldest available Ubuntu: the AppImage runs on distros with this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build AppImage
        run: packaging/linux/build_appimage.sh

      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dist/PS-PKG-Toolkit-x86_64.AppImage --version

      - uses: actions/upload-artifact@v7
        with:
          name: PS-PKG-Toolkit-linux
          path: dist/PS-PKG-Toolkit-x86_64.AppImage

  macos:
    if: ${{ !inputs.notes_only }}
    # Apple Silicon (arm64) runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        # Native "cocoa" platform: the runner has a GUI session, and the frameless
        # Fluent window calls Cocoa APIs that crash under Qt's "offscreen" platform.
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m unittest discover -s tests -v

      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed --name PS-PKG-Toolkit --icon assets/ps-pkg-toolkit.png \
            --osx-bundle-identifier io.github.nanobuo.pspkgtoolkit --exclude-module tkinter pkgfree_main.py
          dist/PS-PKG-Toolkit.app/Contents/MacOS/PS-PKG-Toolkit --version
          # ditto keeps the bundle's symlinks and permissions intact.
          ditto -c -k --keepParent dist/PS-PKG-Toolkit.app PS-PKG-Toolkit-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: PS-PKG-Toolkit-macos
          path: PS-PKG-Toolkit-macos-arm64.zip

  release:
    # On a pushed v* tag, or from "Run workflow" with a release_tag (the tag is
    # then created on the commit that was built).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && !inputs.notes_only)
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the program version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pkgfree/__init__.py)
          echo "tag=$TAG version=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Il tag $TAG non corrisponde alla versione $version in pkgfree/__init__.py"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        # One asset per platform/program; stable names so that
        # /releases/latest/download/<name> links keep working.
        run: |
          mkdir release
          cp artifacts/PS-PKG-Toolkit-windows/PS-PKG-Toolkit.exe release/PS-PKG-Toolkit-windows-x64.exe
          cp artifacts/PS-PKG-Toolkit-windows/pspkg.exe release/pspkg-windows-x64.exe
          cp artifacts/PS-PKG-Toolkit-linux/PS-PKG-Toolkit-x86_64.AppImage release/PS-PKG-Toolkit-linux-x86_64.AppImage
          cp artifacts/PS-PKG-Toolkit-macos/PS-PKG-Toolkit-macos-arm64.zip release/PS-PKG-Toolkit-macos-arm64.zip
          # Copies under the old names: versions up to 1.5 (PKG Free) look for these to
          # update themselves.
          cp release/PS-PKG-Toolkit-windows-x64.exe release/PkgFree-windows-x64.exe
          cp release/PS-PKG-Toolkit-linux-x86_64.AppImage release/PkgFree-linux-x86_64.AppImage
          cp release/PS-PKG-Toolkit-macos-arm64.zip release/PkgFree-macos-arm64.zip
          ls -la release

      - name: Release notes from CHANGELOG.md
        run: |
          # The "## <tag>" section, up to the next "## " heading.
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md \
            | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Manca la sezione '## $TAG' in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: PS PKG Toolkit ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true

  release-notes:
    # "Run workflow" with notes_only: replace the description of an existing
    # release with its CHANGELOG.md section; builds and assets are untouched.
    if: github.event_name == 'workflow_dispatch' && inputs.notes_only && inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Update release notes
        run: |
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md \
            | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Manca la sezione '## $TAG' in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
